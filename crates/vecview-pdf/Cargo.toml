[package]
name = "vecview-pdf"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Direct PDF rasterization and text-layer extraction via pdfium, for vecview."
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow.workspace = true
pdfium-render = "0.9"
pdfium-bundled = { version = "0.1", optional = true, features = ["bundled"] }

[features]
# Embed libpdfium in the binary at build time, so `cargo install` alone yields a working PDF
# path. Off by default: pdfium is a C++ library that has to be fetched from outside the crate
# registry, and a build that reaches the network would break offline and air-gapped builds.
bundled = ["dep:pdfium-bundled"]
